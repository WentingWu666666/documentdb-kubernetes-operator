# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: proxy secret
templates:
  - 08_proxy_secret.yaml
tests:
  - it: should not render the proxy Secret when proxy is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the proxy Secret with routing keys when enabled
    set:
      proxy.isProxyEnabled: true
      proxy.httpProxy: "http://proxy.example.com:3128"
      proxy.httpsProxy: "http://proxy.example.com:3128"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: documentdb-proxy-config
      - equal:
          path: metadata.namespace
          value: documentdb-operator
      - equal:
          path: stringData.HTTP_PROXY
          value: "http://proxy.example.com:3128"
      - equal:
          path: stringData.HTTPS_PROXY
          value: "http://proxy.example.com:3128"

  - it: should always append in-cluster bypass entries to NO_PROXY
    set:
      proxy.isProxyEnabled: true
      proxy.noProxy: "example.internal"
    asserts:
      - matchRegex:
          path: stringData.NO_PROXY
          pattern: "^example.internal,localhost,127.0.0.1,.*\\.svc\\.cluster\\.local.*192.168.0.0/16$"

  - it: should honor the Azure.proxySettings Arc compatibility key
    set:
      Azure.proxySettings.isProxyEnabled: true
      Azure.proxySettings.httpsProxy: "http://arc.example.com:3128"
    asserts:
      - equal:
          path: stringData.HTTPS_PROXY
          value: "http://arc.example.com:3128"

  - it: should fail when both proxy and Azure.proxySettings are enabled
    set:
      proxy.isProxyEnabled: true
      proxy.httpsProxy: "http://oss.example.com:3128"
      Azure.proxySettings.isProxyEnabled: true
      Azure.proxySettings.httpsProxy: "http://arc.example.com:3128"
    asserts:
      - failedTemplate:
          errorMessage: "Set either proxy or Azure.proxySettings, not both"

  - it: should store proxyCert as PROXY_CERT when set
    set:
      proxy.isProxyEnabled: true
      proxy.httpsProxy: "http://proxy.example.com:3128"
      proxy.proxyCert: "-----BEGIN CERTIFICATE-----\nAAAA\n-----END CERTIFICATE-----"
    asserts:
      - equal:
          path: stringData.PROXY_CERT
          value: "-----BEGIN CERTIFICATE-----\nAAAA\n-----END CERTIFICATE-----"

  - it: should omit PROXY_CERT when proxyCert is empty
    set:
      proxy.isProxyEnabled: true
      proxy.httpsProxy: "http://proxy.example.com:3128"
    asserts:
      - notExists:
          path: stringData.PROXY_CERT
